# goreleaser config for the `tm` CLI.
#
# Triggered by `.github/workflows/release.yml` on push of a `v*`
# tag. Produces cross-compiled binaries for every platform in the
# matrix below, archives them as .tar.gz (unix) / .zip (windows),
# generates a SHA-256 checksums file, writes auto-generated release
# notes from commit messages, and uploads everything to a GitHub
# Release.
#
# Local dry-run (no upload, no tag required):
#   cd cli && goreleaser release --snapshot --clean
#
# Release (CI only, with a real git tag pushed):
#   git tag -a v0.1.0 -m "tm v0.1.0" && git push origin v0.1.0
#
# version: 2 is the current goreleaser schema; 1 is deprecated.
version: 2

# The project name is what the install script + Homebrew formula key
# off; it also becomes the default binary name in archives. Keep
# this in sync with `cli/cmd/tm/` (the package name) and the
# README's references to `tm`.
project_name: tm

before:
  hooks:
    - go mod tidy

builds:
  - id: tm
    main: ./cmd/tm
    binary: tm
    env:
      # CGO off so the binary is fully static — runs in a `scratch`
      # Docker image and on any libc-version Linux without surprise
      # symbol-version mismatches.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # Stamp the release version into the binary so `tm version`
      # reports it. {{.Version}} is the git tag without the leading
      # `v` (e.g. "0.1.0"); we re-prefix with `v` to match the tag
      # users see on GitHub.
      - -s -w
      - -X 'github.com/trafficmorph/tm-cli/internal/cli.CLIVersion=v{{.Version}}'

archives:
  - id: tm-archives
    # The default `tar.gz` formats use `format` (singular) in the
    # v2 schema; windows gets `.zip` for native double-click extract.
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      # No LICENSE shipped — the parent project is proprietary; the
      # README's footer carries the standard "© TrafficMorph" line
      # which is the operative license for the CLI binary too.

checksum:
  name_template: "{{ .ProjectName }}_v{{ .Version }}_SHA256SUMS"
  algorithm: sha256

snapshot:
  # Used by `goreleaser release --snapshot` for local dry-run builds
  # without a real git tag. Suffix is timestamp-ish so it's obvious
  # in `tm version` output that you're on a dev build.
  version_template: "{{ incpatch .Version }}-dev-{{ .ShortCommit }}"

changelog:
  # Auto-generate release notes from commits since the previous tag.
  # Filters out housekeeping commits to keep the changelog focused on
  # user-visible behavior. Squash-merged PRs get rolled into one line
  # automatically per their merge-commit subject.
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - "^docs:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  # Stand up the GitHub Release as draft so a human can eyeball the
  # auto-generated notes before publishing. Flip to false once the
  # release flow is trusted (typically after the first 2-3 cuts).
  draft: true
  # `mode: replace` overwrites any existing assets on re-run of the
  # workflow against the same tag — useful for emergency re-cuts
  # when the first attempt had a bad asset.
  mode: replace
