        maxProfiles:
          type: integer
          description: Maximum saved profiles. Creating one more returns 400 "Profile
            limit reached".
          format: int32
          example: 200
        maxScheduledRuns:
          type: integer
          description: Maximum schedule slots (day-of-week + time entries) across
            all profiles.
          format: int32
          example: 100
        maxNotifyEmails:
          type: integer
          description: "Maximum recipient addresses per list: a schedule's notify\
            \ emails and a profile's regression-alert recipients."
          format: int32
          example: 10
        maxVariablesSets:
          type: integer
          description: Maximum uploaded variables sets (CSV data sets).
          format: int32
          example: 25
        historyRetentionDays:
          type: integer
          description: Days run history is kept before the nightly cleanup deletes
            it. Null when the account has no own setting and the server-wide default
            applies.
          format: int32
          nullable: true
          example: 30
        maxRequestBytes:
          type: integer
          description: Maximum UTF-8 size of a profile's `requestBody` plus its `requestHeaders`
            JSON string. Checked when a profile is saved and when a run starts. 0
            = no cap.
          format: int32
          example: 262144
        maxRequestHeadersBytes:
          type: integer
          description: Maximum UTF-8 size of the `requestHeaders` JSON string. 0 =
            no cap.
          format: int32
          example: 65536
        maxRequestHeaderCount:
          type: integer
          description: Maximum number of request headers. 0 = no cap.
          format: int32
          example: 64
        maxRequestHeaderBytes:
          type: integer
          description: "Maximum UTF-8 size of one header line: name + value + 4 bytes\
            \ for the `: ` separator and line break. 0 = no cap."
          format: int32
          example: 8192
        apiRequestsPerMinute:
          type: integer
          description: "Public-API calls allowed per user in a sliding 60-second window,\
            \ shared by all of the account's API keys. Beyond it the API answers 429\
            \ with a `Retry-After` header."
          format: int32
          example: 60
      description: "Effective limits for this account: the plan's defaults with any\
        \ per-account admin overrides applied."
    AccountUsage:
      type: object
      properties:
        usedRequests:
          type: integer
          description: "Requests sent this calendar month (UTC), including requests\
            \ of runs still in flight."
          format: int64
          example: 1250000
        includedRequests:
          type: integer
          description: "Monthly request quota. Once `usedRequests` reaches it, starting\
            \ a run returns 409 `USAGE_LIMIT_REACHED` and looping runs complete at\
            \ the end of their current iteration; a run already in flight is not cut\
            \ short. 0 = no monthly quota (always 0 in `SELF_HOSTED`)."
          format: int64
          example: 30000000
        activeRunCount:
          type: integer
          description: Runs currently `RUNNING` or `PAUSED`; compare with `limits.maxConcurrentRuns`.
          format: int32
        profileCount:
          type: integer
          description: Saved profiles; compare with `limits.maxProfiles`.
          format: int64
        scheduledRunCount:
          type: integer
          description: Schedule slots in use; compare with `limits.maxScheduledRuns`.
          format: int64
        variablesSetCount:
          type: integer
          description: Uploaded variables sets; compare with `limits.maxVariablesSets`.
          format: int64
      description: Current consumption of the account's limits.
    ApiAccountResponse:
      type: object
      properties:
        deploymentMode:
          type: string
          description: "`CLOUD` (hosted service: plans, trial, monthly request quota)\
            \ or `SELF_HOSTED` (on-prem install: no trial, no monthly quota, every\
            \ account gets the highest plan's limits unless an admin set per-account\
            \ overrides)."
          enum:
          - CLOUD
          - SELF_HOSTED
        subscriptionType:
          type: string
          description: Plan tier. In `CLOUD` the limits below derive from it; in `SELF_HOSTED`
            every account gets `BUSINESS` limits whatever is stored here.
          enum:
          - SOLO
          - TEAM
          - BUSINESS
        subscriptionStatus:
          type: string
          description: "Billing state of the paid subscription; `NONE` when there\
            \ is none (trial accounts, self-hosted installs)."
          enum:
          - NONE
          - ACTIVE
          - PAST_DUE
          - CANCELED
        trialEndsAt:
          type: string
          description: "When the free trial ends (or ended). Null when the account\
            \ has no trial clock, and always null in `SELF_HOSTED`."
          format: date-time
          nullable: true
        trialExpired:
          type: boolean
          description: "True once `trialEndsAt` has passed and the subscription isn't\
            \ `ACTIVE`. The API then answers 403 `{\"error\":\"trial_expired\"}` to\
            \ every call except during a grace period (`graceEndsAt`). Always false\
            \ in `SELF_HOSTED`."
        graceEndsAt:
          type: string
          description: End of the grace period that follows a canceled subscription;
            until then the API stays available even though `trialExpired` is true.
            Null when no grace period is running.
          format: date-time
          nullable: true
        limits:
          $ref: "#/components/schemas/AccountLimits"
        usage:
          $ref: "#/components/schemas/AccountUsage"
        features:
          $ref: "#/components/schemas/AccountFeatures"
      description: "The calling account's plan, the limits the server enforces, current\
        \ usage against them, and which plan-gated features are available. Read it\
        \ before creating profiles or starting runs to stay within limits. Unless\
        \ a field says otherwise, a limit of 0 means \"none allowed\", not \"unlimited\"\
        ."
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: API key prefixed with `tm_`. Issued from the in-app settings page.
      name: X-Api-Key
      in: header
    BearerAuth:
      type: http
      description: "Same key as `X-Api-Key`, sent in the `Authorization: Bearer tm_…\
        ` form."
      scheme: bearer
      bearerFormat: tm_<opaque-key>
