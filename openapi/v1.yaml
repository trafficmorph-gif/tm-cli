openapi: 3.0.1
info:
  title: TrafficMorph API
  description: |-
    Programmatic access to TrafficMorph traffic profiles, runs, history, and domain verification. Designed for CI integration: trigger a run, wait for completion, fetch the regression verdict, and gate the build on the result.

    **Authentication.** All `/api/v1/*` endpoints require an API key. Provision keys in the in-app settings page; send each request with either:
      * `X-Api-Key: tm_<key>` (recommended for CI scripts), or
      * `Authorization: Bearer tm_<key>` (recommended for SDKs).

    **Plan gating (CLOUD).** On the hosted service, the public API is a TEAM+ feature — SOLO accounts receive HTTP 403 with `code=PLAN_UPGRADE_REQUIRED`. In **SELF_HOSTED** installs (`app.deployment-mode=SELF_HOSTED`), every endpoint is available to every authenticated user regardless of stored plan tier.

    **Rate limiting.** Requests are limited per user with a sliding window (`api.rate-limit.requests-per-minute`, default 60; the current value is `limits.apiRequestsPerMinute` in `GET /api/v1/account`). Rate-limited responses are HTTP 429 with a `Retry-After` header.

    **Fetching this spec programmatically.** Always use the explicit group URLs `/v3/api-docs/v1` (JSON) or `/v3/api-docs.yaml/v1` (YAML — note the `.yaml` extension is on the BASE path, not the group). The default un-grouped URLs `/v3/api-docs` and `/v3/api-docs.yaml` are intentionally blocked — 401 for unauthenticated callers and 403 for authenticated ones. They would otherwise scan every internal controller in the boot context and leak admin / auth / billing endpoints. Configure SDK generators (`openapi-generator-cli`, `oapi-codegen`, etc.) to point at the v1 group URL directly.
  contact:
    name: TrafficMorph
    url: https://trafficmorph.example.com
    email: support@trafficmorph.example.com
  license:
    name: Proprietary
    url: https://trafficmorph.example.com/terms
  version: v1
servers:
- url: /
  description: TrafficMorph
security:
- ApiKeyAuth: []
- BearerAuth: []
tags:
- name: Variables sets
  description: "CSV-style attached variables — sampled per-request to make profiles\
    \ replay traffic with realistic per-request data (authenticated tokens, parameterized\
    \ URLs, etc.). Pairs with the capture-import flow that auto-creates these from\
    \ production traffic samples."
- name: History
  description: "Past runs: list, filter, inspect, compare and delete. Carries per-run\
    \ latency / throughput / error metrics and the auto-comparison verdict against\
    \ the selected baseline — the key endpoint for CI quality gates."
- name: Domains
  description: Domain ownership verification. Profiles can only target hosts the user
    has proven they own — via DNS TXT record or HTTP-token challenge.
- name: Profiles
  description: "Traffic profile CRUD. A profile holds the target endpoint, RPS curve,\
    \ request body / headers, optional scripts, optional schedule, and alert policy\
    \ that drive each run."
- name: Captures
  description: "JSONL traffic-capture import. Preview a captured trace and atomically\
    \ materialise detected endpoints as TrafficMorph profiles + variables sets. Useful\
    \ for bootstrapping a load test from real production traffic without hand-modelling\
    \ the request shape. The capture is either uploaded (`/analyse`, `/import`) or\
    \ read from a configured capture source (`/analyse-remote`, `/import-remote`;\
    \ see the Capture sources tag)."
- name: Runs
  description: "Start, stop, pause, and resume traffic runs for a saved profile."
- name: Capture sources
  description: |-
    Read-only access to the remote capture sources (SFTP servers, S3 buckets) configured in the web UI: list them, list the capture files on one, then analyse or import a file with `POST /api/v1/captures/analyse-remote` and `/import-remote`.

    Creating, editing, deleting and connection-testing sources are deliberately **not** available through the API. Those operations handle the stored credentials, which are managed only in the web UI and are never returned by any endpoint.
- name: Regions
  description: Dispatch regions a run can originate from.
- name: Account
  description: "The calling account's plan, limits, usage and feature gates."
paths:
  /api/v1/profiles/{id}:
    get:
      tags:
      - Profiles
      summary: Get a profile by id
      description: "Returns the full profile including its schedule (if any) and current\
        \ run status. Returns 400 if the profile doesn't exist or belongs to a different\
        \ user — the service throws `IllegalArgumentException(\"Profile not found\"\
        )` for both cases, and the global handler maps that to 400."
      operationId: getProfile
      parameters:
      - name: id
        in: path
        description: Profile id.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      responses:
        "200":
          description: Profile found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiProfileResponse"
        "400":
          description: "Profile not found or not owned by this user. Body: `{\"error\"\
            :\"Profile not found\"}`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiProfileResponse"
    put:
      tags:
      - Profiles
      summary: Update an existing profile
      description: |-
        Ownership-checks the profile by path id, then updates that specific row in place. The body's `name` is the new value to store, not a lookup key — even if it matches a different profile's name, only the path-id row is mutated. (The save service has both an id-based and a name-based code path; the controller pins the path id on the save request so the id-based branch runs.)

        Name uniqueness is NOT enforced server-side: PUT will happily produce a duplicate-named pair under the same user. Subsequent name-keyed operations (POST `/profiles` upsert) would then resolve to the most-recently-created duplicate, which is rarely what the caller wanted. Clients that care about uniqueness (e.g. the MCP server's `tm_update_profile`) should pre-flight a `GET /profiles` and reject renames that would collide.

        The schedule block, if present, replaces any existing schedule for the profile; omitting it leaves the current schedule untouched. Likewise `variablesSetIds`, `region`, `readinessUrl` and `interpolationMode` keep their stored values when omitted; every other field is replaced from the body.
      operationId: updateProfile
      parameters:
      - name: id
        in: path
        description: Profile id.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiProfileRequest"
        required: true
      responses:
        "400":
          description: "Profile not found / not owned by this user, OR validation\
            \ failure on the request body. Body: `{\"error\":\"<reason>\"}`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiProfileResponse"
        "200":
          description: Profile updated; response carries the full updated entity.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiProfileResponse"
    delete:
      tags:
      - Profiles
      summary: Delete a profile
      description: Removes the profile and its associated schedule. Any in-flight
        run is cancelled. Run history is retained — only the profile definition is
        removed.
      operationId: deleteProfile
      parameters:
      - name: id
        in: path
        description: Profile id.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      responses:
        "400":
          description: "Profile not found or not owned by this user. Body: `{\"error\"\
            :\"Profile not found\"}`."
        "204":
          description: Profile deleted.
  /api/v1/variables-sets:
    get:
      tags:
      - Variables sets
      summary: List the user's variables sets
      description: "Returns metadata for every variables set owned by the API key's\
        \ user. The raw CSV content is intentionally omitted from list responses —\
        \ use `GET /{id}` for a single set's metadata, or download the CSV via the\
        \ in-app UI endpoint if you need row-level inspection."
      operationId: listVariablesSets
      responses:
        "200":
          description: List of variables sets; may be empty.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VariablesSetResponse"
    post:
      tags:
      - Variables sets
      summary: Create a variables set from inline CSV content
      description: |-
        CSV is uploaded as a string in the JSON body (NOT as a multipart file). Size-capped at the parser's `MAX_BYTES` — for larger sets, downsample client-side before uploading.

        The CSV's first row is the column header. Columns whose names match `$$macro$$` placeholders in the profile's URL / body / headers get substituted per-request at run time. An optional special column `weight` (case-insensitive) makes rows pickable with a probability proportional to its value — useful for replaying real traffic distributions.

        Sampling modes (mirrors `VariablesSet.SamplingMode`):
          - `ROW`: one row sampled per request; ALL columns substituted from that row. Preserves cross-column correlations. REQUIRES a `weight` column.
          - `COLUMN`: each column sampled INDEPENDENTLY per request, producing uncorrelated combinations across columns. A shared `weight` column acts as the default weight; per-column `{col}_weight` columns override for individual ones. Weights are optional.
          - `SEQUENTIAL`: rows walked in CSV order; one row per request, wrapping after the last. Weights ignored. Combined with a derived RPS curve, reproduces both the input distribution AND the timing of the original capture.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVariablesSetRequest"
        required: true
      responses:
        "201":
          description: Variables set created.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VariablesSetResponse"
        "400":
          description: "Validation failure: blank name, missing CSV, malformed CSV,\
            \ exceeded size cap, exceeded per-user quota, etc."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VariablesSetResponse"
  /api/v1/profiles:
    get:
      tags:
      - Profiles
      summary: List the authenticated user's profiles
      description: "Returns lightweight summaries (id, name, duration, last-run info)\
        \ for every profile owned by the API key's user. Order: most-recently-updated\
        \ first."
      operationId: listProfiles
      responses:
        "200":
          description: List of profile summaries; may be empty.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrafficProfileSummaryResponse"
    post:
      tags:
      - Profiles
      summary: Create or upsert a profile by name (optionally with schedule)
      description: |-
        Saves a traffic profile keyed by `name`. If a profile with the same name already exists for this user, **it is updated in place rather than rejected** — the underlying service is an upsert. Treat this endpoint as idempotent-by-name. Use `PUT /{id}` instead if you need to update a profile and rename it at the same time.

        If the request body includes a `schedule` block, a `ScheduledRun` is created or replaced in the same logical transaction.

        On an upsert, `variablesSetIds`, `region`, `readinessUrl` and `interpolationMode` keep their stored values when omitted (null); every other field is replaced from the body.
      operationId: createProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiProfileRequest"
        required: true
      responses:
        "400":
          description: "Validation failure: missing required fields, invalid URL,\
            \ blocked target host, per-user profile limit reached on new creation,\
            \ init/cleanup scripts on a non-TEAM plan, etc."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiProfileResponse"
        "201":
          description: Profile saved; response carries the full saved entity. Returned
            for BOTH freshly created profiles AND name-upsert updates of existing
            profiles.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiProfileResponse"
  /api/v1/profiles/{id}/stop:
    post:
      tags:
      - Runs
      summary: Stop the in-flight run for a profile
      description: Resets the profile's run state. Fully idempotent — succeeds with
        `status="IDLE"` even when no run is currently in flight and even when the
        profile id is unknown to the user (the run-state store is keyed by user+profile
        and silently no-ops on misses). Any in-flight dispatch loops cancel within
        a tick.
      operationId: stop
      parameters:
      - name: id
        in: path
        description: ID of the profile whose in-flight run to stop.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      responses:
        "200":
          description: Stop signal acknowledged; response carries the post-stop status
            (`IDLE` after a successful stop).
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TrafficRunControlResponse"
  /api/v1/profiles/{id}/start:
    post:
      tags:
      - Runs
      summary: Start a run for a saved profile
      description: "Loads the profile by id, builds a run-start request from its configured\
        \ RPS curve / endpoint / scripts, and dispatches it. Tagged `triggeredBy=\"\
        api\"` so it can be distinguished from UI- and schedule-triggered runs in\
        \ history. Enforces the user's request-usage quota before starting. Dispatched\
        \ from the profile's default `region` (local when unset), like web-UI and\
        \ scheduled runs. To pick another region or add history tags, use `POST /runs`."
      operationId: start
      parameters:
      - name: id
        in: path
        description: ID of the saved profile to run.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      responses:
        "400":
          description: "Run could not start. Covers: profile not found / not owned,\
            \ concurrent-run limit reached, target domain not verified, init-script\
            \ failure, invalid `targetUrl`, init/cleanup scripts on a non-TEAM plan,\
            \ or any other validation error. Body: `{\"error\":\"<reason>\"}`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TrafficRunControlResponse"
        "409":
          description: "Monthly request-usage quota exhausted. Body carries `code=USAGE_LIMIT_REACHED`,\
            \ plus `usedRequests` / `includedRequests` / `usagePercent` / `upgradeUrl`.\
            \ Distinct from the per-profile concurrent-run cap, which is a 400."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TrafficRunControlResponse"
        "200":
          description: Run started; response carries the run id and current status.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TrafficRunControlResponse"
  /api/v1/profiles/{id}/runs:
    post:
      tags:
      - Runs
      summary: Start a run with per-run options
      description: "Same as `POST /start`, plus an optional dispatch `region` and\
        \ history `tags` for this run. Without a body it behaves exactly like `/start`:\
        \ the profile's default region, no tags. (A separate operation so the existing\
        \ `start` signature in generated clients stays unchanged.)"
      operationId: startRun
      parameters:
      - name: id
        in: path
        description: ID of the saved profile to run.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiRunStartRequest"
      responses:
        "409":
          description: Monthly request-usage quota exhausted; same body as `/start`.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TrafficRunControlResponse"
        "400":
          description: "Same causes as `/start`, plus an unknown or plan-restricted\
            \ `region` and invalid `tags`. Body: `{\"error\":\"<reason>\"}`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TrafficRunControlResponse"
        "200":
          description: Run started; response carries the run id and current status.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TrafficRunControlResponse"
  /api/v1/profiles/{id}/resume:
    post:
      tags:
      - Runs
      summary: Resume a paused run
      description: "Continues dispatch from where `/pause` left off. The RPS curve\
        \ and any SEQUENTIAL variables-set cursors retain their pre-pause position.\
        \ **Not** idempotent in the absence-of-state case — unlike `/pause` and `/stop`,\
        \ calling `/resume` without an in-flight or paused run is a client error."
      operationId: resume
      parameters:
      - name: id
        in: path
        description: ID of the profile whose paused run to resume.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      responses:
        "200":
          description: Resume acknowledged; response carries the post-resume status.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TrafficRunControlResponse"
        "400":
          description: "No run to resume (none in flight or already completed). Body:\
            \ `{\"error\":\"No active run to resume for selected profile\"}` or `{\"\
            error\":\"Run already completed. Start a new run or reset.\"}`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TrafficRunControlResponse"
  /api/v1/profiles/{id}/pause:
    post:
      tags:
      - Runs
      summary: Pause the in-flight run for a profile
      description: "Suspends dispatch. The run retains its position on the RPS curve\
        \ and can be resumed via `/resume`. Idempotent — when no run is currently\
        \ in flight the response is `status=\"IDLE\"` rather than an error, so a CI\
        \ workflow can call `/pause` without first checking state. Useful when a step\
        \ needs to inspect intermediate metrics without losing progress."
      operationId: pause
      parameters:
      - name: id
        in: path
        description: ID of the profile whose in-flight run to pause.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      responses:
        "200":
          description: "Pause acknowledged; response carries the post-pause status\
            \ (`PAUSED` for active runs, `IDLE` when there was nothing to pause)."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TrafficRunControlResponse"
  /api/v1/profiles/import:
    post:
      tags:
      - Profiles
      summary: Import a profile from a portable JSON document
      description: |-
        Saves a `trafficmorph-profile-v1` document, as returned by `GET /profiles/{id}/export`. The body must carry `"_format": "trafficmorph-profile-v1"` plus `name`, `duration`, `endpointUrl` and `points`; the other export fields are optional.

        Upsert by name, like `POST /profiles`: if a profile with the same name (trimmed, case-insensitive) exists, **it is overwritten in place**, keeping its `initScript`, `cleanupScript`, `variablesSetIds` and `region` because the document can't carry them. A new name creates a profile with those unset. To copy a profile instead of overwriting it, change `name` in the document first.

        A `schedule` in the document replaces the profile's schedule; without one the existing schedule is kept. A schedule that can't be saved (loop-enabled profile, invalid timezone or mode, slot limit reached) does not fail the import: the profile is still saved and the reason is listed in `warnings`.
      operationId: importProfile
      requestBody:
        description: "A `trafficmorph-profile-v1` document, as returned by `GET /profiles/{id}/export`."
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
        required: true
      responses:
        "201":
          description: "Profile saved; response carries its id, name, callback secret\
            \ and any `warnings`. Returned for both new profiles and name-upsert overwrites."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ImportTrafficProfileResponse"
        "400":
          description: "Nothing saved. Covers: `_format` missing or not `trafficmorph-profile-v1`,\
            \ a required field missing or of the wrong type, invalid or blocked URL,\
            \ points beyond `duration`, per-user profile limit reached on a new name,\
            \ or init/cleanup scripts on the overwritten profile when the plan no\
            \ longer allows them. Body: `{\"error\":\"<reason>\"}`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ImportTrafficProfileResponse"
  /api/v1/domains:
    get:
      tags:
      - Domains
      summary: List the user's domains and their verification status
      description: "Returns all domains the user has added, with each domain's current\
        \ verification state (`PENDING` / `VERIFIED`) and the challenge tokens still\
        \ in play."
      operationId: listDomains
      responses:
        "200":
          description: List of domains; may be empty.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerifiedDomainResponse"
    post:
      tags:
      - Domains
      summary: Register a new domain for verification
      description: "Idempotent. On first call, generates the verification token and\
        \ creates the record. On subsequent calls for the same `(user, domain)`, returns\
        \ the existing record with the same token — clients can safely retry without\
        \ producing duplicates. The response carries the challenge values the user\
        \ must install before calling `/verify/dns` or `/verify/http`."
      operationId: add
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDomainRequest"
        required: true
      responses:
        "400":
          description: "Blank domain, missing user, or any other validation failure.\
            \ Body: `{\"error\":\"<reason>\"}`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VerifiedDomainResponse"
        "201":
          description: Domain ready for verification. Returned for BOTH a freshly
            created record AND an already-registered one (idempotent contract). Same
            token in both cases.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VerifiedDomainResponse"
  /api/v1/domains/{id}/verify/http:
    post:
      tags:
      - Domains
      summary: Run the HTTP-token verification check
      description: "Fetches `https://{domain}/.well-known/trafficmorph-verify.txt`\
        \ (falling back to HTTP if HTTPS fails) and matches its body against the challenge\
        \ token. Alternative to DNS verification for users without DNS control. **On\
        \ miss**, returns 400 with a remediation message — same fail-fast contract\
        \ as `/verify/dns`."
      operationId: verifyHttp
      parameters:
      - name: id
        in: path
        description: Domain id.
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      responses:
        "400":
          description: "Verification failed. Covers: domain id not owned by this user,\
            \ file not found, file present but token mismatch, or fetch failed over\
            \ both HTTPS and HTTP. Body carries the expected URL + token in the error\
            \ message."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VerifiedDomainResponse"
        "200":
          description: "Domain verified (file matched, or already verified prior to\
            \ this call)."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VerifiedDomainResponse"
  /api/v1/domains/{id}/verify/dns:
    post:
      tags:
      - Domains
      summary: Run the DNS-TXT verification check
      description: "Looks up the configured TXT record at `_trafficmorph-verify.{domain}`\
        \ and matches it against the challenge value issued when the domain was added.\
        \ On match, the domain flips to `VERIFIED` and can be used as a profile target.\
        \ **On miss**, returns 400 with a remediation message — the call is treated\
        \ as a failed verification attempt rather than a polling no-op, so CI flows\
        \ fail fast instead of looping on always-`PENDING` 200s."
      operationId: verifyDns
      parameters:
      - name: id
        in: path
        description: Domain id.
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      responses:
        "200":
          description: "Domain verified (record matched, or already verified prior\
            \ to this call)."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VerifiedDomainResponse"
        "400":
          description: "Verification failed. Covers: domain id not owned by this user,\
            \ no matching TXT record found, or DNS lookup failed. Body carries the\
            \ expected TXT name + token in the error message so the user can fix and\
            \ retry."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VerifiedDomainResponse"
  /api/v1/captures/import:
    post:
      tags:
      - Captures
      summary: Import selected endpoints from a JSONL capture as profiles
      description: |-
        Atomic commit. Re-derives the analysis from the uploaded file (no server-side state is kept between `/analyse` and `/import`), picks the groups named in the `selections` JSON, and persists each one as a TrafficMorph profile — plus a variables set whenever the group has variable positions. Either every selection lands or none. Re-upload the same JSONL file you analysed; selections key by `(method, urlSkeleton)` so re-analysis matches the same groups.

        **Name collisions are NOT errors.** If a chosen `profileName` is already taken for this user, the importer auto-suffixes with `(2)`, `(3)`, … until unique. The created entity in the response carries the final name, so the client can show what actually landed. (Same convention applies to variables-set names.)
      operationId: importCapture
      parameters:
      - name: selections
        in: query
        description: "JSON string with the import selections. Shape: `{\"groups\"\
          :[{\"method\":\"POST\",\"urlSkeleton\":\"https://api.example.com/api/bid\"\
          ,\"profileName\":\"Bid endpoint\"}]}`. Sent as a plain multipart text field\
          \ (not `application/json`) so all HTTP clients including browser `FormData`\
          \ work without content-type acrobatics."
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  description: JSONL traffic-capture file — the same file you analysed.
                  format: binary
      responses:
        "413":
          description: Upload exceeds the multipart size limit.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CaptureImportResult"
        "200":
          description: "Import complete; response carries created-profile ids (with\
            \ the final, possibly auto-suffixed names), any selections skipped because\
            \ no group in the re-analysis matched, and non-fatal warnings."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CaptureImportResult"
        "400":
          description: "Missing file, missing/invalid `selections` JSON, capture failed\
            \ to re-parse, or per-user profile limit reached."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CaptureImportResult"
  /api/v1/captures/import-remote:
    post:
      tags:
      - Captures
      summary: Import selected endpoints from a capture stored on a capture source
      description: |-
        Same atomic commit as `/import`, but the capture is read from one of the user's capture sources and `selections` is an inline JSON object rather than a string field. The server re-analyses the file (no state is kept between `/analyse-remote` and `/import-remote`), matches each selection by `(method, urlSkeleton)`, and persists each match as a profile, plus a variables set when the group has variable positions. Either every selection lands or none. Taken profile names are auto-suffixed `(2)`, `(3)`, ... rather than rejected; the response carries the final names.

        **Retry safety.** A 200 means the import committed: a transport error while closing the remote stream after a successful import is logged, not returned. A 400 or 429 means nothing was imported.

        **Limits.** Same size cap and row / line caps as `/analyse-remote`. Calls for the same source are limited to one every 2 seconds by default (server-configurable), separately from `/analyse-remote`; a faster call gets 429 with `Retry-After`.
      operationId: importRemoteCapture
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureImportRemoteRequest"
        required: true
      responses:
        "400":
          description: "Invalid body (missing `sourceId` / `selections`, blank `path`,\
            \ a selection with blank `method` or `urlSkeleton`); source not found\
            \ or owned by another user (`{\"error\":\"Capture source not found\"}`);\
            \ the file could not be opened (`{\"error\":\"Failed to open remote stream:\
            \ <reason>\"}`); the capture failed to re-parse; or the per-user profile\
            \ limit was reached. Body: `{\"error\":\"<reason>\"}`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CaptureImportResult"
        "429":
          description: "Imported from this source too recently. Body: `{\"error\"\
            :\"Too many import stream requests for this source. Try again in N seconds.\"\
            }`."
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              style: simple
              schema:
                type: integer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CaptureImportResult"
        "200":
          description: "Import complete; response carries created-profile ids (with\
            \ the final, possibly auto-suffixed names), any selections skipped because\
            \ no group in the re-analysis matched, and non-fatal warnings."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CaptureImportResult"
  /api/v1/captures/analyse:
    post:
      tags:
      - Captures
      summary: Analyse a JSONL capture and preview the proposed profiles
      description: "Uploads a JSONL traffic capture and returns a structured preview\
        \ — per detected endpoint: the proposed URL skeleton, derived RPS curve, extracted\
        \ URL + body variables (with cardinality buckets and sample values), and a\
        \ few sample request URLs. **No state is persisted.** Pair with `/import`\
        \ to commit the selections you want."
      operationId: analyse
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  description: "JSONL traffic-capture file. Each line is one captured\
                    \ request (method, url, timestamp, optional headers + body)."
                  format: binary
      responses:
        "200":
          description: Analysis complete; response carries one group per detected
            endpoint.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CaptureAnalysisResponse"
        "400":
          description: "Missing or empty file, or capture failed to parse."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CaptureAnalysisResponse"
        "413":
          description: Upload exceeds the multipart size limit (default 120 MB).
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CaptureAnalysisResponse"
  /api/v1/captures/analyse-remote:
    post:
      tags:
      - Captures
      summary: Analyse a JSONL capture stored on a capture source
      description: |-
        Same preview as `/analyse`, but the capture is read from one of the user's capture sources (SFTP / S3) instead of being uploaded. Take `sourceId` from `GET /api/v1/capture-sources` and `path` from `GET /api/v1/capture-sources/{id}/files`. The file is streamed through the server and never stored, and nothing is created; only the source's `lastListedAt` / `lastError` are updated. Pair with `/import-remote` to commit the groups you want.

        **Limits.** Files larger than the remote-file cap (120 MB by default) are rejected, and the same row / line caps as `/analyse` apply. Calls for the same source are limited to one every 2 seconds by default (server-configurable), counted separately from `/import-remote` so analyse-then-import back to back is fine; a faster call gets 429 with `Retry-After`.
      operationId: analyseRemoteCapture
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureAnalyseRemoteRequest"
        required: true
      responses:
        "200":
          description: Analysis complete; response carries one group per detected
            endpoint.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CaptureAnalysisResponse"
        "400":
          description: "Missing `sourceId` or blank `path`; source not found or owned\
            \ by another user (`{\"error\":\"Capture source not found\"}`); the file\
            \ could not be opened (`{\"error\":\"Failed to open remote stream: <reason>\"\
            }`, e.g. missing file, path outside the source's root, authentication\
            \ failure, file over the size cap); or the capture failed to parse. Body:\
            \ `{\"error\":\"<reason>\"}`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CaptureAnalysisResponse"
        "429":
          description: "Analysed from this source too recently. Body: `{\"error\"\
            :\"Too many analyse stream requests for this source. Try again in N seconds.\"\
            }`."
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              style: simple
              schema:
                type: integer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CaptureAnalysisResponse"
  /api/v1/variables-sets/{id}:
    get:
      tags:
      - Variables sets
      summary: Get a single variables set's metadata
      description: "Returns id, name, sampling mode, macro columns, optional weight\
        \ column, row count, size, and timestamps. Raw CSV content NOT included —\
        \ that's a separate concern served only by the in-app UI endpoint."
      operationId: get
      parameters:
      - name: id
        in: path
        description: Variables set id.
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      responses:
        "400":
          description: "Variables set not found or not owned by this user. The service\
            \ throws `IllegalArgumentException(\"Variables set not found\")` for both\
            \ cases. Body: `{\"error\":\"Variables set not found\"}`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VariablesSetResponse"
        "200":
          description: Variables set found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VariablesSetResponse"
    delete:
      tags:
      - Variables sets
      summary: Delete a variables set
      description: "Removes the set. **Fails fast (HTTP 400) if any profile still\
        \ has this set attached** — the response body's error message names the referencing\
        \ profile(s) so the caller can detach them first. There is NO auto-detach:\
        \ the deliberate design is to make accidental attachment loss visible. To\
        \ delete an attached set, either (a) detach via `tm_update_profile` / the\
        \ UI on each referencing profile and then retry the delete, or (b) delete\
        \ the referencing profiles themselves if they're no longer needed."
      operationId: delete
      parameters:
      - name: id
        in: path
        description: Variables set id.
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      responses:
        "400":
          description: "Set not found, not owned by this user, OR still attached to\
            \ one or more profiles. The error body for the still-attached case has\
            \ shape `{\"error\":\"Can't delete 'name' — still attached to profile(s):\
            \ A, B, .... Detach it from those profiles first.\"}`."
        "204":
          description: Variables set deleted.
    patch:
      tags:
      - Variables sets
      summary: Rename a variables set
      description: "Changes only the display name. The CSV content, mode, and attached-profile\
        \ relationships are untouched."
      operationId: rename
      parameters:
      - name: id
        in: path
        description: Variables set id.
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameVariablesSetRequest"
        required: true
      responses:
        "200":
          description: Variables set renamed.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VariablesSetResponse"
        "400":
          description: Set not found or new name invalid (blank / too long).
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VariablesSetResponse"
  /api/v1/variables-sets/{id}/mode:
    patch:
      tags:
      - Variables sets
      summary: Change the sampling mode of an existing variables set
      description: "Switches between any of the three modes (`ROW`, `COLUMN`, `SEQUENTIAL`)\
        \ without re-uploading the CSV. Most common use: a capture-import-created\
        \ set lands in `ROW` mode by default; flip it to `SEQUENTIAL` for ordered\
        \ replay that reproduces the original traffic order, or to `COLUMN` for uncorrelated\
        \ per-column sampling. The server re-parses the stored CSV with the target\
        \ mode and 400s if incompatible (e.g. switching to `ROW` on a CSV with no\
        \ `weight` column). See the POST endpoint description for the full mode semantics."
      operationId: changeMode
      parameters:
      - name: id
        in: path
        description: Variables set id.
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeVariablesSetModeRequest"
        required: true
      responses:
        "200":
          description: Mode changed.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VariablesSetResponse"
        "400":
          description: Set not found or mode invalid.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VariablesSetResponse"
  /api/v1/regions:
    get:
      tags:
      - Regions
      summary: List the dispatch regions available to this user
      description: "Region codes accepted by a profile's `region` and by the `region`\
        \ field of `POST /api/v1/profiles/{id}/start`. The local (in-process) region\
        \ is listed whenever it's enabled. Remote regions appear only when the plan\
        \ allows multi-region dispatch and at least one agent is connected."
      operationId: listRegions
      responses:
        "200":
          description: "Enabled regions, ordered by region code."
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRegionResponse"
  /api/v1/profiles/{id}/status:
    get:
      tags:
      - Runs
      summary: Get the live status of a profile's run
      description: "Returns the in-flight run's progress: status, elapsed time, requests\
        \ sent, response-code counts, current RPS and the last minute of 5-second\
        \ buckets (RPS, outcome ratios, latency percentiles). Poll this instead of\
        \ subscribing to the WebSocket. `IDLE` when nothing is running; once a run\
        \ finishes, its final metrics and verdict are in `/api/v1/history`."
      operationId: getRunStatus
      parameters:
      - name: id
        in: path
        description: Profile id.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      responses:
        "200":
          description: Current run state.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiRunStatusResponse"
        "400":
          description: "Profile not found or not owned by this user. Body: `{\"error\"\
            :\"Profile not found\"}`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiRunStatusResponse"
  /api/v1/profiles/{id}/export:
    get:
      tags:
      - Profiles
      summary: Export a profile as a portable JSON document
      description: |-
        Returns the profile as a `trafficmorph-profile-v1` document, the same file the web UI's Export button downloads. Feed it to `POST /profiles/import` to restore it or copy it to another account.

        Fields: `_format`, `name`, `duration`, `loop`, `endpointUrl`, `httpMethod`, `requestPayload`, `requestHeaders`, `points`, `interpolationMode`, `responseScript`, `callbackUrl`, `readinessUrl`, `autoAlertEnabled`, `autoAlertMinSeverity`, `autoAlertCooldownMinutes`, `autoAlertRecipients`, and `schedule` (`mode`, `timezone`, `notifyEmails`, `slots`) only when the profile has one.

        Not included: the profile id, `initScript`, `cleanupScript`, `variablesSetIds`, `region` and the callback secret. Use `GET /profiles/{id}` for the full profile.
      operationId: exportProfile
      parameters:
      - name: id
        in: path
        description: Profile id.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      responses:
        "200":
          description: The portable document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: "Profile not found or not owned by this user. Body: `{\"error\"\
            :\"Profile not found\"}`."
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /api/v1/history:
    get:
      tags:
      - History
      summary: List past runs with optional filters
      description: "Paginated run history. Filters narrow by profile, trigger source\
        \ (`api` / `manual` / `scheduled`), region, regression verdict (`PASS` / `WARN`\
        \ / `FAIL` / `NO_BASELINE`), tag, and date range. All filters are AND-combined.\
        \ Use `autoVerdict=FAIL` to fetch the runs a CI gate should care about."
      operationId: listHistory
      parameters:
      - name: page
        in: query
        description: Zero-based page index.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Page size (max 100).
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: profileId
        in: query
        description: Filter to a single profile.
        required: false
        schema:
          type: integer
          format: int64
      - name: triggeredBy
        in: query
        description: "Filter by trigger source: `api`, `manual` (web UI), `scheduled`."
        required: false
        schema:
          type: string
      - name: region
        in: query
        description: Filter by region code (e.g. `us-east-1`).
        required: false
        schema:
          type: string
      - name: autoVerdict
        in: query
        description: "Filter by auto-comparison verdict: `PASS`, `WARN`, `FAIL`, `NO_BASELINE`."
        required: false
        schema:
          type: string
      - name: tag
        in: query
        description: Filter by tag.
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: "Lower bound on the run's `createdAt` (ISO-8601), the time its\
          \ history row was written when the run finished."
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: "Upper bound on the run's `createdAt` (ISO-8601), the time its\
          \ history row was written when the run finished."
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Page of run summaries plus pagination metadata.
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /api/v1/history/{id}:
    get:
      tags:
      - History
      summary: Get a single run's full detail
      description: "Returns the run's complete metric set: response-code distribution,\
        \ latency quantiles, RPS / latency time series, secondary stats from response\
        \ scripts, the auto-comparison snapshot against baseline, and the verdict\
        \ reasoning. This is the endpoint a CI step polls after `/profiles/{id}/start`\
        \ to decide pass/fail."
      operationId: getHistoryItem
      parameters:
      - name: id
        in: path
        description: Run id.
        required: true
        schema:
          type: integer
          format: int64
        example: 1234
      responses:
        "200":
          description: Run found; response carries every captured metric.
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
        "400":
          description: "Run not found or not owned by this user. The service throws\
            \ `IllegalArgumentException(\"Run history not found\")` for both cases,\
            \ and the global handler maps that to 400. Body: `{\"error\":\"Run history\
            \ not found\"}`."
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
    delete:
      tags:
      - History
      summary: Delete a run from history
      description: "Permanently removes one run's history record and metrics. Takes\
        \ the history `id` (not the in-memory `runId`). The run disappears from listings\
        \ and can no longer be compared; verdicts already stored on other runs are\
        \ kept, and later runs pick their automatic baseline from the remaining history.\
        \ Only finished runs have a history record; to end a run in flight use `POST\
        \ /profiles/{id}/stop`."
      operationId: deleteRun
      parameters:
      - name: id
        in: path
        description: Run-history id (the `id` field of a history item).
        required: true
        schema:
          type: integer
          format: int64
        example: 1234
      responses:
        "400":
          description: "Run not found or not owned by this user (the two aren't distinguished,\
            \ so ids of other accounts can't be probed). Body: `{\"error\":\"Run history\
            \ not found\"}`. Deleting the same id twice returns this on the second\
            \ call."
        "204":
          description: Run deleted.
  /api/v1/history/filters:
    get:
      tags:
      - History
      summary: List the values the history filters accept
      description: "Everything needed to build a `GET /api/v1/history` query without\
        \ guessing: the profiles, regions and tags present in this account's run history\
        \ (each matches at least one run), plus the fixed `triggeredBy` and `autoVerdict`\
        \ value sets. A tag or region that isn't listed matches no runs."
      operationId: listHistoryFilters
      responses:
        "200":
          description: Filter values; lists are empty when there is no history.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiHistoryFiltersResponse"
  /api/v1/history/compare:
    get:
      tags:
      - History
      summary: Compare two runs of the same profile
      description: "The comparison the web UI's compare view shows. `runA` in the\
        \ response is always the more recent run. Latency p50 / p95 / p99 are compared\
        \ with a t-test over the runs' time buckets; success, error and per-status-code\
        \ counts with a bootstrap against the profile's historical run-to-run deltas.\
        \ `significant` flags a change unlikely to be noise."
      operationId: compareRuns
      parameters:
      - name: runA
        in: query
        description: Run-history id of one run.
        required: true
        schema:
          type: integer
          format: int64
        example: 1234
      - name: runB
        in: query
        description: Run-history id of the other run.
        required: true
        schema:
          type: integer
          format: int64
        example: 1198
      responses:
        "400":
          description: "Same run twice, or runs from different profiles."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunComparisonResponse"
        "404":
          description: A run doesn't exist or isn't owned by this user.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunComparisonResponse"
        "200":
          description: Comparison computed.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunComparisonResponse"
  /api/v1/capture-sources:
    get:
      tags:
      - Capture sources
      summary: List the user's remote capture sources
      description: "Returns every capture source owned by the API key's user, ordered\
        \ by name: id, name, kind (`SFTP` or `S3`), root path / prefix, and the outcome\
        \ of the last listing or read (`lastListedAt`, `lastError`). Does not contact\
        \ the remote servers. Credentials are never included. An empty list means\
        \ no source has been configured; sources can only be added in the web UI."
      operationId: listCaptureSources
      responses:
        "200":
          description: Capture sources; may be empty.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaptureSourceResponse"
  /api/v1/capture-sources/{id}/files:
    get:
      tags:
      - Capture sources
      summary: List capture files on a remote capture source
      description: |-
        Connects to the source and lists the `.jsonl` / `.ndjson` files directly under its root path (SFTP) or key prefix (S3), newest first. Subdirectories are not descended and hidden (dot) files are skipped. Pass a returned `path` to `POST /api/v1/captures/analyse-remote` or `/import-remote`.

        Updates the source's `lastListedAt` on success and `lastError` on failure.

        **Rate limit:** each call opens a connection to the remote server, so calls for the same source are limited to one every 3 seconds by default (server-configurable); a faster call gets 429 with `Retry-After`.
      operationId: listCaptureSourceFiles
      parameters:
      - name: id
        in: path
        description: Capture source id (from `listCaptureSources`).
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      - name: limit
        in: query
        description: Maximum number of files to return. Values outside 1 to 1000 are
          clamped into that range.
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "429":
          description: "Listed this source too recently. Body: `{\"error\":\"Too many\
            \ list files requests for this source. Try again in N seconds.\"}`."
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              style: simple
              schema:
                type: integer
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaptureSourceFile"
        "200":
          description: "Matching files, newest first; may be empty."
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaptureSourceFile"
        "400":
          description: "Source not found or owned by another user (`{\"error\":\"\
            Capture source not found\"}`), or the remote listing failed (`{\"error\"\
            :\"Failed to list files: <reason>\"}`, e.g. authentication failure, unreachable\
            \ host, missing directory or bucket)."
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaptureSourceFile"
  /api/v1/account:
    get:
      tags:
      - Account
      summary: "Get the account's plan, limits and current usage"
      description: "Returns the limits the server enforces for this account (RPS caps,\
        \ concurrent runs, saved profiles, schedule slots, variables sets, request\
        \ size, API rate), how much of each is in use, the monthly request quota,\
        \ and which plan-gated features are available. Call it before creating profiles\
        \ or starting runs to plan a load test that fits, instead of discovering a\
        \ limit through a 400 or 409. Contains no personal data."
      operationId: getAccount
      responses:
        "200":
          description: Account summary.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiAccountResponse"
        "403":
          description: "API access not allowed for this account. Body: `{\"error\"\
            :\"API access requires Team or Business plan.\",\"code\":\"PLAN_UPGRADE_REQUIRED\"\
            }` on a SOLO plan, or `{\"error\":\"trial_expired\"}` once the trial has\
            \ ended without a subscription."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiAccountResponse"
  /api/v1/profiles/{id}/schedule:
    delete:
      tags:
      - Profiles
      summary: Remove a profile's schedule
      description: |-
        Deletes every schedule slot of the profile, so it stops running automatically. The profile itself and its run history are untouched, and a run the schedule already started is not stopped (use `POST /profiles/{id}/stop`). Idempotent: returns 204 also when the profile has no schedule.

        This is the only v1 way to remove a schedule: `POST /profiles` and `PUT /profiles/{id}` without a `schedule` block leave the current schedule as it is.
      operationId: deleteSchedule
      parameters:
      - name: id
        in: path
        description: Profile id.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      responses:
        "204":
          description: "Schedule removed, or there was none."
        "400":
          description: "Profile not found or not owned by this user. Body: `{\"error\"\
            :\"Profile not found\"}`."
  /api/v1/domains/{id}:
    delete:
      tags:
      - Domains
      summary: Remove a domain
      description: Deletes the domain and its challenges. Profiles targeting this
        domain remain saved but won't be runnable until another verified domain covers
        the target host.
      operationId: remove
      parameters:
      - name: id
        in: path
        description: Domain id.
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      responses:
        "400":
          description: "Domain not found or not owned by this user. Body: `{\"error\"\
            :\"Domain not found\"}`."
        "204":
          description: Domain removed.
components:
  schemas:
    ApiProfileRequest:
      required:
      - duration
      - name
      - points
      - targetUrl
      type: object
      properties:
